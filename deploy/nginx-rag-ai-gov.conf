# ──────────────────────────────────────────────────────────────
# nginx-rag-ai-gov.conf — 정적 프론트 + /api 리버스 프록시
#
# 배치 위치:
#   Debian/Ubuntu : /etc/nginx/sites-available/rag-ai-gov.conf  (+ sites-enabled 심볼릭 링크)
#   RHEL/Rocky    : /etc/nginx/conf.d/rag-ai-gov.conf
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/rag-ai-gov;
    index index.html;

    # 문서 업로드 — PDF/DOCX 대용량 허용
    client_max_body_size 200M;

    access_log /var/log/nginx/rag-ai-gov.access.log;
    error_log  /var/log/nginx/rag-ai-gov.error.log;

    # ── API 리버스 프록시 ──
    # 프론트는 /api/... 로 호출 → 백엔드는 /... 로 수신
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 로컬 LLM 추론 + CrewAI 멀티에이전트는 수 분이 걸릴 수 있음
        # (research_crew 모드 기준 ~60초, 대형 모델은 그 이상)
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # 스트리밍 응답이 버퍼에 갇히지 않도록
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── 정적 자산 캐시 ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA 라우팅 폴백 ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 은 캐시 금지 (배포 즉시 반영)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── 기본 보안 헤더 ──
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
