# ──────────────────────────────────────────────────────────────
# nginx-rag-ai-gov.conf — 정적 프론트 + /api 리버스 프록시
#
# 배치 위치:
#   Debian/Ubuntu : /etc/nginx/sites-available/rag-ai-gov.conf  (+ sites-enabled 심볼릭 링크)
#   RHEL/Rocky    : /etc/nginx/conf.d/rag-ai-gov.conf
#
# 공통 앱 설정은 snippets/rag-ai-gov-app.conf 로 분리되어 있습니다.
#
# 도메인: rag.ets0404.com → 211.119.38.216
#   default_server 로 두었으므로 도메인·IP 어느 쪽으로 들어와도 이 블록이 받습니다.
#
# 인증서:
#   현재는 deploy/setup-https.sh 가 만든 자체 서명 인증서입니다.
#   DNS A 레코드가 서버를 가리키면 Let's Encrypt 로 전환할 수 있습니다:
#     sudo certbot certonly --webroot -w /var/www/html -d rag.ets0404.com
#   발급 후 아래 ssl_certificate 경로를 /etc/letsencrypt/live/rag.ets0404.com/ 로 바꾸세요.
#
# ⚠ 포트 80 평문 서빙 중 — 로그인 토큰이 평문으로 오갑니다.
#   211.119.38.216 은 상위 네트워크에서 443/tcp 가 차단되어 있어
#   HTTPS 로만 서빙하면 외부에서 접속이 불가능합니다. 그래서 80·443 양쪽에
#   같은 앱을 띄워 둡니다. 443 이 열리는 즉시 아래 '### HTTPS 전용 전환'
#   주석대로 80 을 리다이렉트로 되돌리세요.
# ──────────────────────────────────────────────────────────────

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name rag.ets0404.com;

    # certbot 도메인 검증 경로 (평문 필수)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    ### HTTPS 전용 전환 ###
    # 443/tcp 가 외부에 열리면 아래 include 를 지우고 이 두 줄의 주석을 해제하세요.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    include /etc/nginx/snippets/rag-ai-gov-app.conf;
}

server {
    # nginx 1.24 이하는 listen 플래그, 1.25.1+ 는 별도의 'http2 on;' 을 씁니다.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name rag.ets0404.com;

    # Let's Encrypt 발급 후:
    #   ssl_certificate     /etc/letsencrypt/live/rag.ets0404.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/rag.ets0404.com/privkey.pem;
    ssl_certificate     /etc/ssl/rag-ai-gov/fullchain.pem;
    ssl_certificate_key /etc/ssl/rag-ai-gov/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    include /etc/nginx/snippets/rag-ai-gov-app.conf;
}
