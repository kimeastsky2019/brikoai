# ──────────────────────────────────────────────────────────────
# rag-ai-gov-security-headers.conf — 기본 보안 헤더
#
# add_header 는 상속되지 않고 하위 블록에서 재정의되면 통째로 덮이므로,
# add_header 를 쓰는 location 마다 이 파일을 함께 include 합니다.
#
# 배치 위치: /etc/nginx/snippets/rag-ai-gov-security-headers.conf
# ──────────────────────────────────────────────────────────────

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# HSTS 는 신뢰 인증서(Let's Encrypt)로 전환한 뒤 켜세요.
# 자체 서명 상태에서 켜면 브라우저가 예외 허용을 거부해 접속이 막힙니다.
# add_header Strict-Transport-Security "max-age=31536000" always;
